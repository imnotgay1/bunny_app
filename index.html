<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>토끼별 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:#FFF9EF;
    font-family:'Nunito', sans-serif;
    color:#26333D;
    overflow:hidden;
    touch-action: manipulation;
    user-select:none;
  }
  #app{ height:100%; display:flex; flex-direction:column; }

  header{
    padding: 16px 22px 6px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  .logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800; font-size: 20px; color: #FB7A5A;
    display:flex; align-items:center; gap:8px;
  }
  .logo .bunny{ font-size:28px; display:inline-block; }
  .logo .bunny.hop{ animation: hop 0.5s ease; }
  @keyframes hop{
    0%{ transform: translateY(0) rotate(0); }
    30%{ transform: translateY(-12px) rotate(-10deg); }
    60%{ transform: translateY(0) rotate(8deg); }
    100%{ transform: translateY(0) rotate(0); }
  }
  .header-right{ display:flex; align-items:center; gap:8px; }
  .star-counter{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:15px; color:#F4A261;
    background:white; padding:8px 14px; border-radius:999px;
    box-shadow: 0 5px 0 rgba(38,51,61,0.12);
  }
  .icon-btn{
    background:white; border:none; width:46px; height:46px;
    border-radius:15px; font-size:19px; flex-shrink:0;
    box-shadow: 0 5px 0 rgba(38,51,61,0.12);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{ transform: translateY(4px); box-shadow:none; }
  .home-btn{ visibility:hidden; }
  .home-btn.show{ visibility:visible; }

  .tabbar{
    display:flex; gap:8px; padding: 8px 22px 0;
    flex-shrink:0; overflow-x:auto; white-space:nowrap;
  }
  .tabbar::-webkit-scrollbar{ display:none; }
  .tab{
    border:none; background: #F0EAD8; color: #8C8370;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    padding: 8px 13px; border-radius: 999px; flex-shrink:0;
    display:flex; align-items:center; gap:5px;
    transition: background .15s, color .15s;
  }
  .tab.active{ color:white; }

  .screen{
    flex:1; display:none; flex-direction:column;
    padding: 12px 20px 18px; overflow:hidden;
  }
  .screen.active{ display:flex; }

  .subtitle{
    font-family:'Baloo 2', sans-serif; font-size:18px; font-weight:700;
    opacity:0.75; margin: 4px 0 12px; flex-shrink:0;
  }

  /* 언어 선택 화면 */
  #screen-language{ align-items:center; justify-content:center; }
  .lang-title{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px;
    margin-bottom:22px; color:#26333D;
  }
  .lang-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:340px; }
  .lang-card{
    border:none; border-radius:24px; width:104px; height:140px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color:white; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:15px;
    box-shadow: 0 7px 0 rgba(0,0,0,0.15); position:relative; overflow:hidden;
  }
  .lang-card::before{
    content:''; position:absolute; top:-25%; left:-15%; width:80%; height:80%;
    background: radial-gradient(circle, rgba(255,255,255,0.32), transparent 70%);
    pointer-events:none;
  }
  .lang-card .lang-emoji{ font-size:40px; position:relative; z-index:1; }
  .lang-card > div{ position:relative; z-index:1; }
  .lang-card:active{ transform: translateY(5px); box-shadow:none; }

  .topic-grid, .badge-grid{
    display:grid; grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 92px; gap:14px; overflow-y:auto; padding-bottom:8px;
    flex:1; min-height:0;
  }
  .topic-grid.two-col{ grid-template-columns: repeat(2, 1fr); grid-auto-rows: 120px; }
  .topic-card{
    border:none; border-radius:22px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px;
    color:white; box-shadow: 0 6px 0 rgba(0,0,0,0.14); padding: 8px;
  }
  .topic-card::before{
    content:''; position:absolute; top:-25%; left:-15%; width:70%; height:70%;
    background: radial-gradient(circle, rgba(255,255,255,0.32), transparent 70%);
    pointer-events:none;
  }
  .icon-badge{
    width:42px; height:42px; border-radius:13px; flex-shrink:0;
    background: rgba(255,255,255,0.94);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:800; color:#26333D; position:relative; z-index:1;
    box-shadow: 0 3px 6px rgba(0,0,0,0.16), inset 0 -2px 3px rgba(0,0,0,0.06);
  }
  .topic-card > div{ position:relative; z-index:1; }
  .topic-card:active{ transform: translateY(4px); box-shadow:none; }
  .topic-card .count{ font-size:11px; font-weight:600; opacity:0.85; }

  .badge{
    border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
    color:#B8AE8C; background:#EDE7D8; padding:8px; text-align:center; position:relative; overflow:hidden;
  }
  .badge.complete::before{
    content:''; position:absolute; top:-25%; left:-15%; width:70%; height:70%;
    background: radial-gradient(circle, rgba(255,255,255,0.32), transparent 70%);
    pointer-events:none;
  }
  .badge > div{ position:relative; z-index:1; }
  .badge.complete{ color:white; }
  .badge .icon-badge{ width:36px; height:36px; font-size:18px; border-radius:11px; }
  .badge-progress{ font-size:11px; opacity:0.9; }

  .play-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; flex-shrink:0; gap:10px;
  }
  .play-header .topic-title{
    font-family:'Baloo 2', sans-serif; font-size:20px; font-weight:800;
  }
  .quiz-btn{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    background:#FB7A5A; color:white; border:none; padding:9px 15px;
    border-radius:14px; box-shadow: 0 5px 0 rgba(0,0,0,0.15); flex-shrink:0;
  }
  .quiz-btn:active{ transform: translateY(4px); box-shadow:none; }

  .card-grid{
    display:grid; grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 118px; gap:12px; overflow-y:auto; padding-bottom:10px;
    flex:1; min-height:0;
  }
  .word-card, .letter-card{
    border:none; border-radius:20px; background: #FFFFFF;
    box-shadow: 0 6px 0 rgba(38,51,61,0.10);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; padding: 6px; position:relative; overflow:hidden;
  }
  .thumb{
    width: 72%; aspect-ratio: 1/1; border-radius: 14px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:#F4F1E8; transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .letter-card .thumb{ width:44px; height:44px; aspect-ratio:unset; }
  .thumb img{ width:100%; height:100%; object-fit:contain; }
  .thumb video{ width:100%; height:100%; object-fit:contain; border-radius:inherit; }
  .thumb .fallback-emoji{ font-size: min(6.5vw, 36px); }
  .letter-card .thumb .fallback-emoji{ font-size:22px; }
  .word-card .word{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size: 14px; }
  .letter-card .big-letter{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:36px; line-height:1;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .letter-card .example{ font-family:'Nunito', sans-serif; font-weight:700; font-size: 11px; opacity:0.75; }
  .word-card:active, .letter-card:active{ transform: translateY(3px); box-shadow:none; }
  .word-card.bounce .thumb{ transform: scale(1.16) rotate(-4deg); }
  .letter-card.bounce .big-letter{ transform: scale(1.22) rotate(-4deg); }

  .spinner{
    width:20px; height:20px; border:4px solid #E3DCC8; border-top-color: #B8AE8C;
    border-radius:50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .word-card .spark, .letter-card .spark{ position:absolute; font-size:16px; opacity:0; pointer-events:none; }
  .word-card.bounce .spark, .letter-card.bounce .spark{ animation: spark-fly 0.7s ease-out forwards; }
  .spark.s1{ top:6%; left:5%; }
  .spark.s2{ top:5%; right:5%; }
  @keyframes spark-fly{
    0%{ opacity:1; transform: scale(0.3) translateY(0); }
    100%{ opacity:0; transform: scale(1.3) translateY(-16px); }
  }

  .quiz-grid{
    display:grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: auto;
    gap:16px; flex:1; min-height:0; overflow-y:auto; padding-bottom:8px; align-content:start;
  }
  .quiz-card{
    border:none; border-radius:24px; background:white;
    box-shadow: 0 6px 0 rgba(38,51,61,0.10);
    display:flex; align-items:center; justify-content:center; padding:10px;
    aspect-ratio: 1/1; overflow:hidden;
  }
  .quiz-card .thumb{ width:80%; }
  .quiz-card .big-letter{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:50px; }
  .quiz-card.shake{ animation: shake 0.4s; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-8px); } 75%{ transform: translateX(8px); }
  }
  .quiz-card.correct-flash{ box-shadow: 0 0 0 5px #4CAF7D inset; }
  .quiz-result{
    grid-column: 1 / -1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px;
  }

  .praise-bubble{
    position:fixed; transform:translate(-50%,-20px) scale(0.6); opacity:0;
    background:white; color:#FB7A5A; font-family:'Baloo 2', sans-serif; font-weight:800; font-size:16px;
    padding:8px 16px; border-radius:16px; box-shadow:0 6px 14px rgba(0,0,0,0.18);
    pointer-events:none; z-index:999; transition: all .25s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;
  }
  .praise-bubble.show{ opacity:1; transform:translate(-50%,-64px) scale(1); }
  .confetti-piece{
    position:fixed; font-size:20px; pointer-events:none; z-index:998;
    animation: confetti-fly 0.85s ease-out forwards;
  }
  @keyframes confetti-fly{
    to{ transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(200deg); opacity:0; }
  }

  .video-modal{
    position:fixed; inset:0; background:rgba(10,10,15,0.92); z-index:2000;
    display:none; align-items:center; justify-content:center;
  }
  .video-modal.show{ display:flex; }
  .video-modal video{ max-width:94%; max-height:82%; border-radius:18px; background:black; }
  .video-modal-close{
    position:absolute; top:18px; right:18px; width:48px; height:48px; border-radius:50%;
    background:white; border:none; font-size:22px; z-index:2001;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div id="app">
  <div class="video-modal" id="videoModal" onclick="if(event.target.id==='videoModal') closeVideoModal();">
    <button class="video-modal-close" onclick="closeVideoModal()">✕</button>
    <video id="videoModalPlayer" controls playsinline></video>
  </div>
  <header>
    <div class="logo"><span class="bunny" id="bunny">🐰</span><span id="appTitle">토끼별 놀이터</span></div>
    <div class="header-right">
      <div class="star-counter" id="starCounter">⭐ 0</div>
      <button class="icon-btn" id="langBtn" onclick="showScreen('screen-language')">🌐</button>
      <button class="icon-btn" onclick="openCollection()">🏆</button>
      <button class="icon-btn" id="loadVideosBtn" onclick="document.getElementById('videoFileInput').click()" style="display:none;">📁</button>
      <button class="icon-btn home-btn" id="homeBtn" onclick="goHome()">🏠</button>
    </div>
  </header>
  <input type="file" id="videoFileInput" accept="video/*" multiple style="display:none;">

  <div class="tabbar" id="tabbar" style="display:none;"></div>

  <div class="screen active" id="screen-language">
    <div class="lang-title">뭘 배워볼까?</div>
    <div class="lang-row">
      <button class="lang-card" style="background:linear-gradient(135deg,#6BC79A,#3E9C6E);" onclick="selectLanguage('ko')">
        <div class="lang-emoji">🇰🇷</div><div>한글놀이</div>
      </button>
      <button class="lang-card" style="background:linear-gradient(135deg,#6FB3F2,#3E86D8);" onclick="selectLanguage('en')">
        <div class="lang-emoji">🇺🇸</div><div>영어놀이</div>
      </button>
      <button class="lang-card" style="background:linear-gradient(135deg,#F2A66F,#D87A3E);" onclick="selectLanguage('vid')">
        <div class="lang-emoji">🎬</div><div>영상영어놀이</div>
      </button>
    </div>
  </div>

  <div class="screen" id="screen-home">
    <div class="subtitle" id="homeSubtitle">오늘은 뭐하고 놀까?</div>
    <div class="topic-grid" id="topicGrid"></div>
  </div>

  <div class="screen" id="screen-play">
    <div class="play-header">
      <div class="topic-title" id="playTitle"></div>
      <button class="quiz-btn" onclick="startQuiz(currentCatKey)">🎯 퀴즈로 풀기</button>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <div class="screen" id="screen-quiz">
    <div class="play-header">
      <div class="topic-title" id="quizProgress"></div>
      <button class="icon-btn" onclick="replayQuizWord()">🔊</button>
    </div>
    <div class="subtitle" id="quizPrompt" style="margin-top:-4px;"></div>
    <div class="quiz-grid" id="quizGrid"></div>
  </div>

  <div class="screen" id="screen-collection">
    <div class="subtitle">모은 스티커판</div>
    <div class="badge-grid" id="badgeGrid"></div>
  </div>
</div>

/* ---------- 이미지 (영어=en.wikipedia, 한글 예시단어=ko.wikipedia) ---------- */
const imageCache = {};
async function fetchThumbnail(title, lang){
  const key = `${lang}:${title}`;
  if (key in imageCache) return imageCache[key];
  try{
    const res = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
    if(!res.ok) throw new Error('no data');
    const data = await res.json();
    const url = (data.thumbnail && data.thumbnail.source) || null;
    imageCache[key] = url; return url;
  }catch(e){ imageCache[key] = null; return null; }
}
function renderThumb(thumbEl, info){
  if (!thumbEl) return;
  fetchThumbnail(info.title, info.lang).then(url => {
    if (!thumbEl.isConnected) return;
    if (url) {
      const img = document.createElement('img');
      img.src = url; img.alt = info.title;
      img.onerror = () => { thumbEl.innerHTML = `<div class="fallback-emoji">${info.emoji}</div>`; };
      thumbEl.innerHTML = ''; thumbEl.appendChild(img);
    } else {
      thumbEl.innerHTML = `<div class="fallback-emoji">${info.emoji}</div>`;
    }
  });
}
let thumbObserver = null;
function getThumbObserver(){
  if (thumbObserver) return thumbObserver;
  thumbObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        thumbObserver.unobserve(el);
        renderThumb(el, { title: el.dataset.title, lang: el.dataset.lang, emoji: el.dataset.emoji });
      }
    });
  }, { root: null, rootMargin: '200px', threshold: 0.01 });
  return thumbObserver;
}
function observeThumb(thumbEl, info){
  thumbEl.dataset.title = info.title;
  thumbEl.dataset.lang = info.lang;
  thumbEl.dataset.emoji = info.emoji;
  getThumbObserver().observe(thumbEl);
}

let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
function speak(text, lang){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.82; u.pitch = 1.12;
    const voice = voices.find(v => v.lang === lang) || voices.find(v => v.lang && v.lang.startsWith(lang.slice(0,2)));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 효과음 ---------- */
let audioCtx;
function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playTone(freqs, dur){
  try{
    const ctx = getCtx(); let t = ctx.currentTime;
    freqs.forEach(f => {
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.33, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t+dur+0.02);
      t += dur*0.75;
    });
  }catch(e){}
}
function playChime(){ playTone([523.25, 659.25, 783.99], 0.13); }
function playRetry(){ playTone([320], 0.16); }

function burstConfetti(anchorEl, count){
  const emojis = ['🎉','⭐','✨','🎊','💛','💚','💙'];
  const rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth/2, top: window.innerHeight/2, width:0, height:0 };
  const originX = rect.left + rect.width/2, originY = rect.top + rect.height/2;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const angle = Math.random()*Math.PI*2, dist = 60 + Math.random()*100;
    piece.style.left = `${originX}px`; piece.style.top = `${originY}px`;
    piece.style.setProperty('--dx', `${Math.cos(angle)*dist}px`);
    piece.style.setProperty('--dy', `${Math.sin(angle)*dist - 50}px`);
    document.body.appendChild(piece);
    setTimeout(()=> piece.remove(), 900);
  }
}

function shadeColor(hex, percent){
  const f = parseInt(hex.slice(1), 16), t = percent < 0 ? 0 : 255, p = Math.abs(percent) / 100;
  const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x0000FF;
  return "#" + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 +
    (Math.round((t - G) * p) + G) * 0x100 + (Math.round((t - B) * p) + B)).toString(16).slice(1);
}

  grid.innerHTML = '';
  Object.entries(cats).forEach(([key, cat]) => {
    const btn = document.createElement('button');
    btn.className = 'topic-card';
    btn.style.background = `linear-gradient(135deg, ${shadeColor(cat.color, 20)}, ${shadeColor(cat.color, -18)})`;
    btn.innerHTML = `<div class="icon-badge">${cat.icon}</div><div>${cat.title}</div><div class="count">${cat.items.length}개</div>`;

    const tab = document.createElement('button');

    tab.onclick = () => openTopic(key);
    tabbar.appendChild(tab);
  });
}

  else if (currentLanguage === 'vid') openTopicVID(key);
  else openTopicKO(key);
  showScreen('screen-play');
  document.querySelectorAll('.tab').forEach(t => {
    const active = t.dataset.key === key;
    const col = CATEGORY_SETS[currentLanguage][key].color;
    t.classList.toggle('active', active);
    t.style.background = active ? `linear-gradient(135deg, ${shadeColor(col, 20)}, ${shadeColor(col, -18)})` : '';
  });
}
function openTopicEN(key){
  const cat = EN_CATEGORIES[key];
  document.getElementById('playTitle').textContent = cat.title;
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  cat.items.forEach((item) => {
    const card = document.createElement('button');
    card.className = 'word-card';
    const thumbId = `thumb-en-${key}-${item.word.replace(/\s+/g,'_')}`;
    card.innerHTML = `<div class="thumb" id="${thumbId}"><div class="spinner"></div></div><div class="word">${item.word}</div>`;
    card.onclick = () => {
      playChime();
      setTimeout(()=> speak(item.word, 'en-US'), 150);
      card.classList.remove('bounce'); void card.offsetWidth; card.classList.add('bounce');
      setTimeout(()=> card.classList.remove('bounce'), 700);
      markDiscovered(key, item.word);
      addStar(1); showPraise(card); burstConfetti(card, 12);
    };
    grid.appendChild(card);
    observeThumb(document.getElementById(thumbId), { title: item.wiki || item.word, lang:'en', emoji:item.emoji });
  });
}

/* ---------- 영상영어놀이: videos/폴더의 mp4를 카드에 재생 (없으면 이모지로 대체) ---------- */
function slugify(word){
  return word.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}
/* 기기에서 직접 고른 영상 (폴더/호스팅 없이 즉석에서 불러오기) */
const loadedVideoBlobs = {};
function toast(msg){
  const bubble = document.createElement('div');
  bubble.className = 'praise-bubble';
  bubble.textContent = msg;
  document.body.appendChild(bubble);
  bubble.style.left = '50%'; bubble.style.top = '86px';
  requestAnimationFrame(()=> bubble.classList.add('show'));
  setTimeout(()=> bubble.remove(), 1400);
}
document.getElementById('videoFileInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  files.forEach(file => {
    const base = file.name.replace(/\.[^.]+$/, '');
    const slug = slugify(base);
    if (loadedVideoBlobs[slug]) URL.revokeObjectURL(loadedVideoBlobs[slug]);
    loadedVideoBlobs[slug] = URL.createObjectURL(file);
  });
  if (files.length) toast(`🎬 영상 ${files.length}개 불러옴!`);
  if (currentLanguage === 'vid' && document.getElementById('screen-play').classList.contains('active') && currentCatKey) {
    openTopic(currentCatKey);
  }
  e.target.value = '';
});
let videoObserver = null;
function getVideoObserver(){
  if (videoObserver) return videoObserver;
  videoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        videoObserver.unobserve(el);
        loadVideoThumb(el, { word: el.dataset.word, emoji: el.dataset.emoji });
      }
    });
  }, { root: null, rootMargin: '150px', threshold: 0.01 });
  return videoObserver;
}
function observeVideoThumb(thumbEl, item){
  if (loadedVideoBlobs[slugify(item.word)]) { loadVideoThumb(thumbEl, item); return; }
  thumbEl.dataset.word = item.word;
  thumbEl.dataset.emoji = item.emoji;
  getVideoObserver().observe(thumbEl);
}
function loadVideoThumb(thumbEl, info){
  if (!thumbEl) return;
  const slug = slugify(info.word);
  const video = document.createElement('video');
  video.setAttribute('muted', ''); video.setAttribute('playsinline', ''); video.setAttribute('webkit-playsinline', '');
  video.muted = true; video.loop = true; video.playsInline = true; video.preload = 'auto';
  const tryPlay = () => { video.play().catch(()=>{}); };
  video.onerror = () => { thumbEl.innerHTML = `<div class="fallback-emoji">${info.emoji}</div>`; };
  video.onloadeddata = tryPlay;
  video.oncanplay = tryPlay;
  video.src = loadedVideoBlobs[slug] || `videos/${slug}.mp4`;
  thumbEl.innerHTML = '';
  thumbEl.appendChild(video);
}
function openTopicVID(key){
  const cat = EN_CATEGORIES[key];
  document.getElementById('playTitle').textContent = cat.title;
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  cat.items.forEach((item) => {
    const card = document.createElement('button');
    card.className = 'word-card';
    const thumbId = `thumb-vid-${key}-${item.word.replace(/\s+/g,'_')}`;
    card.innerHTML = `<div class="thumb" id="${thumbId}"><div class="spinner"></div></div><div class="word">${item.word}</div>`;
    card.onclick = () => {
      const slug = slugify(item.word);
      card.classList.remove('bounce'); void card.offsetWidth; card.classList.add('bounce');
      setTimeout(()=> card.classList.remove('bounce'), 700);
      markDiscovered(key, item.word);
      addStar(1); showPraise(card); burstConfetti(card, 12);
      setTimeout(()=> openVideoModal(item.word, slug), 200);
    };
    grid.appendChild(card);
    observeVideoThumb(document.getElementById(thumbId), item);
  });
}
function openVideoModal(word, slug){
  const modal = document.getElementById('videoModal');
  const player = document.getElementById('videoModalPlayer');
  player.muted = false; player.loop = false;
  player.src = loadedVideoBlobs[slug] || `videos/${slug}.mp4`;
  player.onerror = () => { closeVideoModal(); };
  modal.classList.add('show');
  player.currentTime = 0;
  player.play().catch(()=>{});
}
function closeVideoModal(){
  const modal = document.getElementById('videoModal');
  const player = document.getElementById('videoModalPlayer');
  player.pause(); player.removeAttribute('src'); player.load();
  modal.classList.remove('show');
}
function openTopicKO(key){
  const cat = KO_CATEGORIES[key];
  document.getElementById('playTitle').textContent = cat.title;
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  cat.items.forEach((item) => {
    const card = document.createElement('button');
    card.className = 'letter-card';
    const thumbId = `thumb-ko-${key}-${item.letter}`;
    card.innerHTML = `
      <span class="spark s1">⭐</span><span class="spark s2">✨</span>
      <div class="big-letter" style="color:${cat.color}">${item.letter}</div>
      <div class="thumb" id="${thumbId}"><div class="spinner"></div></div>
      <div class="example">${item.example}</div>
    `;
    card.onclick = () => {
      speak(item.name, 'ko-KR');
      setTimeout(()=> speak(item.example, 'ko-KR'), 700);
      card.classList.remove('bounce'); void card.offsetWidth; card.classList.add('bounce');
      setTimeout(()=> card.classList.remove('bounce'), 700);
      markDiscovered(key, item.letter);
      addStar(1); showPraise(card); burstConfetti(card, 12);
    };
    grid.appendChild(card);
    observeThumb(document.getElementById(thumbId), { title: item.example, lang:'ko', emoji:item.emoji });
  });
}

/* ---------- 퀴즈 ---------- */
function shuffleArray(arr){
  for (let i = arr.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
let quizState = null;
function startQuiz(catKey){
  if (!catKey) return;
  if (currentLanguage === 'ko') startQuizKO(catKey); else startQuizEN(catKey);
}
function startQuizEN(catKey){
  const cat = EN_CATEGORIES[catKey];
  const pool = shuffleArray([...cat.items]);
  const qCount = Math.min(5, pool.length);
  const questions = pool.slice(0, qCount).map(target => {
    const distractors = shuffleArray(cat.items.filter(w => w.word !== target.word)).slice(0,3);
    return { target, options: shuffleArray([target, ...distractors]) };
  });
  quizState = { lang:'en', catKey, questions, qIndex: 0 };
  showScreen('screen-quiz');
  renderQuizQuestion();
}
function startQuizKO(catKey){
  const cat = KO_CATEGORIES[catKey];
  const pool = shuffleArray([...cat.items]);
  const qCount = Math.min(5, pool.length);
  const questions = pool.slice(0, qCount).map(target => {
    const distractors = shuffleArray(cat.items.filter(w => w.letter !== target.letter)).slice(0,3);
    return { target, options: shuffleArray([target, ...distractors]) };
  });
  quizState = { lang:'ko', catKey, questions, qIndex: 0 };
  showScreen('screen-quiz');
  renderQuizQuestion();
}
function renderQuizQuestion(){
  const q = quizState.questions[quizState.qIndex];
  document.getElementById('quizProgress').textContent = `문제 ${quizState.qIndex+1} / ${quizState.questions.length}`;
  const grid = document.getElementById('quizGrid');
  grid.innerHTML = '';
  if (quizState.lang === 'en') {
    document.getElementById('quizPrompt').textContent = '소리를 듣고 알맞은 그림을 골라봐!';
    q.options.forEach((opt, i) => {
      const card = document.createElement('button');
      card.className = 'quiz-card';
      const thumbId = `qthumb-${i}`;
      card.innerHTML = `<div class="thumb" id="${thumbId}"><div class="spinner"></div></div>`;
      card.onclick = () => handleQuizAnswer(opt, card, 'word');
      grid.appendChild(card);
      renderThumb(document.getElementById(thumbId), { title: opt.wiki || opt.word, lang:'en', emoji: opt.emoji });
    });
    setTimeout(()=> speak(q.target.word, 'en-US'), 350);
  } else {
    document.getElementById('quizPrompt').textContent = '소리를 듣고 알맞은 글자를 골라봐!';
    const cat = KO_CATEGORIES[quizState.catKey];
    q.options.forEach((opt) => {
      const card = document.createElement('button');
      card.className = 'quiz-card';
      card.innerHTML = `<div class="big-letter" style="color:${cat.color}">${opt.letter}</div>`;
      card.onclick = () => handleQuizAnswer(opt, card, 'letter');
      grid.appendChild(card);
    });
    setTimeout(()=> speak(q.target.name, 'ko-KR'), 350);
  }
}
function replayQuizWord(){
  if (!quizState) return;
  const q = quizState.questions[quizState.qIndex];
  if (quizState.lang === 'en') speak(q.target.word, 'en-US');
  else speak(q.target.name, 'ko-KR');
}
function handleQuizAnswer(opt, card, kind){
  const q = quizState.questions[quizState.qIndex];
  const isCorrect = kind === 'word' ? (opt.word === q.target.word) : (opt.letter === q.target.letter);
  if (isCorrect){
    card.classList.add('correct-flash');
    celebrate(card, 2);
    setTimeout(()=>{
      quizState.qIndex++;
      if (quizState.qIndex >= quizState.questions.length) finishQuiz();
      else renderQuizQuestion();
    }, 750);
  } else {
    playRetry();
    card.classList.add('shake');
    setTimeout(()=> card.classList.remove('shake'), 400);
  }
}
function finishQuiz(){
  document.getElementById('quizPrompt').textContent = '참 잘했어요!';
  document.getElementById('quizGrid').innerHTML = `
    <div class="quiz-result">
      <div style="font-size:52px;">🏆</div>
      <button class="quiz-btn" onclick="startQuiz(quizState.catKey)">다시하기</button>
      <button class="quiz-btn" onclick="goHome()">홈으로</button>
    </div>`;
  burstConfetti(null, 30);
  playChime();
}

/* ---------- 컬렉션(스티커판) ---------- */
function openCollection(){
  if (!currentLanguage) { showScreen('screen-language'); return; }
  const cats = CATEGORY_SETS[currentLanguage];
  const grid = document.getElementById('badgeGrid');
  grid.innerHTML = '';
  Object.entries(cats).forEach(([key, cat]) => {
    const sk = stateKeyFor(key);
    const done = (STATE.discovered[sk] || []).length;
    const total = cat.items.length;
    const complete = done >= total;
    const badge = document.createElement('div');
    badge.className = 'badge' + (complete ? ' complete' : '');
    if (complete) badge.style.background = `linear-gradient(135deg, ${shadeColor(cat.color, 20)}, ${shadeColor(cat.color, -18)})`;
    badge.innerHTML = `<div class="icon-badge">${cat.icon}</div><div>${cat.title}</div><div class="badge-progress">${done}/${total}${complete ? ' ✅' : ''}</div>`;
    grid.appendChild(badge);
  });
  showScreen('screen-collection');
}

/* ---------- 스와이프로 카테고리 이동 ---------- */
function attachSwipe(el, onSwipe){
  let startX = 0, startY = 0;
  el.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; startX = t.clientX; startY = t.clientY;
  }, { passive:true });
  el.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) onSwipe(dx < 0 ? 'left' : 'right');
  }, { passive:true });
}
attachSwipe(document.getElementById('screen-play'), (dir) => {
  const keys = Object.keys(CATEGORY_SETS[currentLanguage]);
  let idx = keys.indexOf(currentCatKey);
  idx = dir === 'left' ? (idx + 1) % keys.length : (idx - 1 + keys.length) % keys.length;
  openTopic(keys[idx]);
});

updateStarCounter();
